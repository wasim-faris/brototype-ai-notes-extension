# Render Blueprint for the shared backend.
# https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render reads
# this file, creates the web service, and prompts for every `sync: false`
# value (the secrets) on first deploy. Nothing secret is stored in this file.

services:
  - type: web
    name: brototype-ai-notes-backend
    runtime: node
    plan: free
    # The backend imports the extension's provider adapters (../extension/src/ai),
    # so the whole repo is the root and the service runs from backend/.
    rootDir: .
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # --- secrets: entered in the Render dashboard, never committed --------
      # No AI key: every user brings their own, and it never reaches this server.
      - key: NOTION_OAUTH_CLIENT_ID
        sync: false
      - key: NOTION_OAUTH_CLIENT_SECRET
        sync: false
      # --- public configuration ----------------------------------------------
      # https://<extension-id>.chromiumapp.org/notion  (Notion -> Advanced in the extension)
      - key: NOTION_OAUTH_REDIRECT_URI
        sync: false
      # The published extension's id, so no other extension can use this server.
      - key: ALLOWED_EXTENSION_IDS
        sync: false
